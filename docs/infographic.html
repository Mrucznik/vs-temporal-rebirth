<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1400px; height: 620px; background: #15120f; overflow: hidden; }
  body {
    font-family: "Noto Serif", "DejaVu Serif", serif;
    color: #eadfcc;
    background: radial-gradient(ellipse 900px 400px at 50% 60%, #2a221b 0%, transparent 72%), #15120f;
  }
  header { text-align: center; padding-top: 40px; }
  h1 { font-size: 58px; letter-spacing: 10px; color: #d8cbb2; text-shadow: 0 0 22px rgba(95, 212, 196, .25); }
  h1 span { color: #5fd4c4; }
  .sub { margin-top: 6px; font-size: 21px; letter-spacing: 3px; color: #a99a84; font-style: italic; }

  .steps { position: absolute; left: 60px; right: 60px; top: 210px; display: flex; align-items: flex-start; }
  .step { flex: 1; text-align: center; }
  .step svg { display: block; margin: 0 auto; }
  .step h2 { margin-top: 22px; font-size: 30px; letter-spacing: 4px; }
  .step p { margin: 12px auto 0; width: 240px; font-size: 21px; line-height: 1.4; color: #d8cbb2; }
  .arrow { flex: none; width: 70px; padding-top: 58px; text-align: center; color: #8a7a64; font-size: 44px; }
  .teal { color: #5fd4c4; } .rust { color: #c4622d; } .pale { color: #b9c7d6; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="riftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a8" stop-opacity=".95"/>
      <stop offset="35%" stop-color="#c4622d" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#6e3518" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b9c7d6" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#b9c7d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<header>
  <h1>TEMPORAL <span>REBIRTH</span></h1>
  <div class="sub">Hardcore lives · ghosts · a way back</div>
</header>

<div class="steps">
  <div class="step">
    <svg width="130" height="130" viewBox="-65 -65 130 130">
      <circle r="62" fill="#221d18" stroke="#3a3129" stroke-width="2"/>
      <g transform="scale(1.35)">
        <circle r="17" fill="none" stroke="#5fd4c4" stroke-width="6"/>
        <circle r="6" fill="#5fd4c4"/>
        <g fill="#5fd4c4">
          <rect x="-4" y="-27" width="8" height="10" rx="1"/><rect x="-4" y="17" width="8" height="10" rx="1"/>
          <rect x="-27" y="-4" width="10" height="8" rx="1"/><rect x="17" y="-4" width="10" height="8" rx="1"/>
          <rect x="-4" y="-27" width="8" height="10" rx="1" transform="rotate(45)"/><rect x="-4" y="-27" width="8" height="10" rx="1" transform="rotate(135)"/>
          <rect x="-4" y="-27" width="8" height="10" rx="1" transform="rotate(225)"/><rect x="-4" y="-27" width="8" height="10" rx="1" transform="rotate(315)"/>
        </g>
      </g>
    </svg>
    <h2 class="teal">LIVES</h2>
    <p>Temporal gears give you extra lives</p>
  </div>

  <div class="arrow">➜</div>

  <div class="step">
    <svg width="130" height="130" viewBox="-65 -65 130 130">
      <circle r="62" fill="#221d18" stroke="#3a3129" stroke-width="2"/>
      <g transform="translate(0,6)">
        <path d="M-26,34 L-26,-4 C-26,-22 -14,-31 0,-31 C14,-31 26,-22 26,-4 L26,34 Z" fill="#3a3129" stroke="#c4622d" stroke-width="3"/>
        <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#c4622d" stroke-width="3"/>
        <line x1="-12" y1="8" x2="12" y2="8" stroke="#c4622d" stroke-width="3"/>
        <line x1="-38" y1="34" x2="38" y2="34" stroke="#6b5c4c" stroke-width="4"/>
      </g>
    </svg>
    <h2 class="rust">LAST LIFE</h2>
    <p>Spend them all and you do not respawn</p>
  </div>

  <div class="arrow">➜</div>

  <div class="step">
    <svg width="130" height="130" viewBox="-65 -65 130 130">
      <circle r="62" fill="url(#halo)" stroke="#3a3129" stroke-width="2"/>
      <circle r="48" fill="none" stroke="#b9c7d6" stroke-opacity=".45" stroke-width="2" stroke-dasharray="5 7"/>
      <g transform="translate(0,6) scale(1.05)">
        <path d="M-30,30 L-30,-8 C-30,-32 -15,-46 0,-46 C15,-46 30,-32 30,-8 L30,30 L20,22 L10,30 L0,22 L-10,30 L-20,22 Z"
              fill="#cdd8e3" fill-opacity=".9" stroke="#eef3f8" stroke-width="1.6"/>
        <circle cx="-10" cy="-14" r="5" fill="#15120f"/><circle cx="10" cy="-14" r="5" fill="#15120f"/>
      </g>
    </svg>
    <h2 class="pale">GHOST</h2>
    <p>Haunt the place where you fell</p>
  </div>

  <div class="arrow">➜</div>

  <div class="step">
    <svg width="130" height="130" viewBox="-65 -65 130 130">
      <circle r="62" fill="#221d18" stroke="#3a3129" stroke-width="2"/>
      <ellipse rx="34" ry="46" fill="url(#riftGlow)"/>
      <path d="M0,-38 L7,-16 L-4,-4 L8,10 L-3,24 L2,40" fill="none" stroke="#ffe6c4" stroke-width="3.5" stroke-linejoin="round"/>
    </svg>
    <h2 class="teal">RETURN</h2>
    <p>Come back the next day, or sooner through a ritual at a rift</p>
  </div>
</div>
</body>
</html>
